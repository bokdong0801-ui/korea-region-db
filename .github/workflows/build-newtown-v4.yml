name: Build Korea Newtown Geo Master V4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-newtown-v4.yml'
      - 'scripts/build_newtown_overlay.py'
      - 'scripts/augment_geo_v4_newtown.py'
      - 'data/rules/newtowns_official.csv'

jobs:
  build-newtown-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mkdir -p /tmp/v3 /tmp/newtown/normalized /tmp/v4/master /tmp/v4

      - name: Download audited Geo Master V3 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10341947255/zip" \
            -o /tmp/v3.zip
          unzip -oq /tmp/v3.zip -d /tmp/v3
          test -s /tmp/v3/geo/master/places_geo_master.csv
          test -s /tmp/v3/tpsis/normalized/places_development.csv
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v3/geo/master/geo_master_report.json',encoding='utf-8'))
          assert r['places']==65447 and r['relations']==124317 and r['unresolved_geo_relations']==0, r
          print('AUDITED V3 INPUT PASS',r)
          PY

      - name: Build official 22-newtown overlay
        run: |
          python scripts/build_newtown_overlay.py \
            --development-dir /tmp/v3/tpsis/normalized \
            --rules data/rules/newtowns_official.csv \
            --snapshot-date 2026-09-14 --out-dir /tmp/newtown/normalized
          cat /tmp/newtown/normalized/newtown_overlay_report.json

      - name: Overlay Newtown layer onto V3
        run: |
          python scripts/augment_geo_v4_newtown.py \
            --v3-geo-dir /tmp/v3/geo/master \
            --newtown-dir /tmp/newtown/normalized \
            --out-dir /tmp/v4/master
          cat /tmp/v4/master/geo_master_v4_report.json

      - name: V4 quality gate
        run: |
          python - <<'PY'
          import csv,json
          n=json.load(open('/tmp/newtown/normalized/newtown_overlay_report.json',encoding='utf-8'))
          g=json.load(open('/tmp/v4/master/geo_master_v4_report.json',encoding='utf-8'))
          assert n['newtowns']==22, n
          assert n['generation_counts']=={'1':5,'2':12,'3':5}, n
          assert n['project_relations']==26 and n['unmatched_projects']==0, n
          assert n['verified_newtowns']==22, n
          assert g['base_v3_places']==65447, g
          assert g['places']==65469 and g['added_newtowns']==22, g
          assert g['relations']==124343 and g['added_newtown_relations']==26, g
          assert g['newtown_count']==22 and g['unresolved_geo_relations']==0, g
          with open('/tmp/v4/master/relations_geo_master.csv',encoding='utf-8-sig',newline='') as f:
            rels=list(csv.DictReader(f))
          nt=[r for r in rels if r['relation_type']=='NEWTOWN_PROJECT_OF']
          assert len(nt)==26, len(nt)
          print('GEO MASTER V4 NEWTOWN QUALITY GATE PASS')
          PY

      - name: Write V4 manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          roots=[pathlib.Path('/tmp/newtown'),pathlib.Path('/tmp/v4')]
          files=[]
          for root in roots:
            for p in sorted(root.rglob('*')):
              if p.is_file(): files.append({'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={'release':'korea-geo-master-v4-newtown','base_v3_artifact_id':10341947255,'base_v3_places':65447,'newtowns':22,'project_links':26,'final_places':65469,'final_relations':124343,'snapshot_date':'2026-09-14','files':files}
          pathlib.Path('/tmp/v4/V4_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload Geo Master V4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: korea-geo-master-v4-newtown-20260914
          path: |
            /tmp/newtown/**
            /tmp/v4/**
          if-no-files-found: error
          retention-days: 90
