name: Discover Official Village Sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover-village-source.yml'

jobs:
  discover-village-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Inspect MAFRA village dataset page and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://data.mafra.go.kr/opendata/data/indexOpenDataDetail.do?data_id=20170216000000000771'
          curl -fsSL -A 'Mozilla/5.0' "$PAGE" -o /tmp/mafra.html
          echo '=== PAGE BYTES ==='
          wc -c /tmp/mafra.html
          echo '=== DOWNLOAD FUNCTIONS ==='
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/mafra.html').read_text(encoding='utf-8',errors='ignore')
          for needle in ['function getDataTotal','function getDataCsv','function getDataXls','function filedownload']:
              i=s.find(needle)
              print('\n###',needle,'OFFSET',i)
              if i>=0: print(s[i:i+5000])
          PY
          echo '=== SAMPLE XML TOTAL ==='
          curl -fsSL --max-time 30 'http://211.237.50.150:7080/openapi/sample/xml/Grid_20160127000000000340_1/1/5' | head -c 1200 || true
          echo
          echo '=== END ==='
