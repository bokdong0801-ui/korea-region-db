name: Discover Official Village Sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/discover-village-source.yml'

jobs:
  discover-village-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Inspect MAFRA village dataset page and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://data.mafra.go.kr/opendata/data/indexOpenDataDetail.do?data_id=20170216000000000771'
          curl -fsSL -A 'Mozilla/5.0' "$PAGE" -o /tmp/mafra.html
          echo '=== PAGE BYTES ==='
          wc -c /tmp/mafra.html
          echo '=== RELEVANT HTML ==='
          grep -Eoi '.{0,140}(Grid_20160127000000000340_1|file[^" ]*down|download|excel|xls|csv|openapi).{0,220}' /tmp/mafra.html | head -n 120 || true
          echo '=== SCRIPT SOURCES ==='
          grep -Eo '<script[^>]+src="[^"]+' /tmp/mafra.html | sed 's/.*src="//' | head -n 80 || true
          echo '=== SAMPLE XML ==='
          curl -fsSL --max-time 30 'http://211.237.50.150:7080/openapi/sample/xml/Grid_20160127000000000340_1/1/5' | head -c 4000 || true
          echo
          echo '=== SAMPLE XLS HEADERS ==='
          curl -fsSL --max-time 30 'http://211.237.50.150:7080/openapi/sample/xls/Grid_20160127000000000340_1/1/5' -o /tmp/sample.xls || true
          file /tmp/sample.xls || true
          wc -c /tmp/sample.xls || true
          echo '=== END ==='
