name: Build Korea Region Master V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-mois.yml'
      - 'scripts/download_codego_bjd.py'
      - 'scripts/import_codego_bjd.py'
      - 'scripts/import_mois_jscode.py'
      - 'scripts/validate_places.py'
      - 'scripts/build_master.py'
      - 'scripts/build_history.py'
      - 'scripts/export_master.py'
      - 'data/rules/relation_exceptions.csv'
      - 'sql/schema.sql'

jobs:
  build-master-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Prepare working paths
        run: mkdir -p /tmp/mois /tmp/codego

      - name: Restore official MOIS snapshot cache
        id: mois-cache
        uses: actions/cache@v4
        with:
          path: /tmp/mois/jscode20260720_abolished.zip
          key: mois-jscode-20260720-c32eb452ae7f2d7300e33b444e8d4c7aaf4faa356444cec87fb545f2a702969d

      - name: Download official MOIS jscode snapshot
        if: steps.mois-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARTICLE='https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000052&nttId=127979'
          URL='https://www.mois.go.kr/cmm/fms/FileDown.do?atchFileId=FILE_00147311ctH5-ah&fileSn=2'
          curl -fsSL --connect-timeout 15 --max-time 45 --retry 3 --retry-delay 4 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -c /tmp/mois/cookies.txt "$ARTICLE" -o /tmp/mois/article.html
          curl -fSL --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 5 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -b /tmp/mois/cookies.txt -c /tmp/mois/cookies.txt -e "$ARTICLE" \
            "$URL" -o /tmp/mois/jscode20260720_abolished.zip

      - name: Verify and extract MOIS snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/mois/jscode20260720_abolished.zip
          echo 'c32eb452ae7f2d7300e33b444e8d4c7aaf4faa356444cec87fb545f2a702969d  /tmp/mois/jscode20260720_abolished.zip' | sha256sum -c -
          sha256sum /tmp/mois/jscode20260720_abolished.zip | tee /tmp/mois/SHA256SUMS.txt
          unzip -t /tmp/mois/jscode20260720_abolished.zip
          unzip -l /tmp/mois/jscode20260720_abolished.zip | tee /tmp/mois/ZIP_CONTENTS.txt
          mkdir -p /tmp/mois/extracted
          unzip -o /tmp/mois/jscode20260720_abolished.zip -d /tmp/mois/extracted

      - name: Download official Code.go legal-dong full snapshot
        run: |
          python scripts/download_codego_bjd.py \
            --snapshot-date 2026-09-14 \
            --out-dir /tmp/codego

      - name: Normalize MOIS administrative/legal/mapping files
        run: |
          python scripts/import_mois_jscode.py /tmp/mois/extracted \
            --snapshot-date 2026-07-20 \
            --out-dir /tmp/mois/normalized

      - name: Normalize Code.go legal-dong full file
        run: |
          python scripts/import_codego_bjd.py /tmp/codego/codego_bjd_full_2026-09-14.txt \
            --snapshot-date 2026-09-14 \
            --out-dir /tmp/mois/normalized

      - name: Validate normalized official place files
        run: |
          python scripts/validate_places.py /tmp/mois/normalized/places_admin.csv
          python scripts/validate_places.py /tmp/mois/normalized/places_legal_mois.csv
          python scripts/validate_places.py /tmp/mois/normalized/places_legal.csv

      - name: Build Master DB V1
        run: |
          python scripts/build_master.py \
            --normalized-dir /tmp/mois/normalized \
            --rules-dir data/rules \
            --out-dir /tmp/mois/master
          cat /tmp/mois/master/build_master_report.json

      - name: Build place history
        run: |
          python scripts/build_history.py --master-dir /tmp/mois/master
          cat /tmp/mois/master/place_history_report.json

      - name: Enforce V1 quality gate
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, sys
          report=json.load(open('/tmp/mois/master/build_master_report.json',encoding='utf-8'))
          codego=json.load(open('/tmp/mois/normalized/codego_bjd_import_meta.json',encoding='utf-8'))
          unresolved=list(csv.DictReader(open('/tmp/mois/master/unresolved_relations.csv',encoding='utf-8-sig')))
          exceptions=list(csv.DictReader(open('/tmp/mois/master/relation_exceptions.csv',encoding='utf-8-sig')))
          assert codego['rows'] >= 20000, f"Code.go full snapshot unexpectedly small: {codego['rows']}"
          assert codego['errors'] == 0, f"Code.go import errors: {codego['errors']}"
          assert len(unresolved) == 0, f"Unresolved relations remain: {len(unresolved)}"
          assert report['relations_unresolved'] == 0
          assert len(exceptions) <= 12, f"Unexpected relation exceptions: {len(exceptions)}"
          print('V1 QUALITY GATE PASS')
          print('Code.go rows:', codego['rows'])
          print('Audited relation exceptions:', len(exceptions))
          PY

      - name: Export JSON and MySQL SQL
        run: |
          python scripts/export_master.py \
            --master-dir /tmp/mois/master \
            --out-dir /tmp/mois/exports
          ls -lh /tmp/mois/exports

      - name: Write release manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/mois')
          paths=[]
          for sub in ('master','exports','normalized'):
              for p in sorted((root/sub).glob('*')):
                  if p.is_file():
                      paths.append({'path':str(p.relative_to(root)), 'bytes':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          meta=json.load(open('/tmp/codego/codego_bjd_download_meta.json',encoding='utf-8'))
          manifest={'release':'korea-region-master-v1','release_date':'2026-09-14','files':paths,'codego_raw':meta}
          (root/'V1_RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload fixed V1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-region-master-v1-20260914
          path: |
            /tmp/codego/**
            /tmp/mois/jscode20260720_abolished.zip
            /tmp/mois/normalized/**
            /tmp/mois/master/**
            /tmp/mois/exports/**
            /tmp/mois/SHA256SUMS.txt
            /tmp/mois/ZIP_CONTENTS.txt
            /tmp/mois/V1_RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
