name: Sync MOIS Region Codes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-mois.yml'
      - 'scripts/import_mois_jscode.py'

jobs:
  sync-latest-jscode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Download latest official MOIS jscode snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mois
          ARTICLE='https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000052&nttId=127979'
          URL='https://www.mois.go.kr/cmm/fms/FileDown.do?atchFileId=FILE_00147311ctH5-ah&fileSn=2'

          curl -fsSL \
            --connect-timeout 15 --max-time 45 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -c /tmp/mois/cookies.txt \
            "$ARTICLE" -o /tmp/mois/article.html

          curl -fSL \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -b /tmp/mois/cookies.txt -c /tmp/mois/cookies.txt \
            -e "$ARTICLE" \
            "$URL" -o /tmp/mois/jscode20260720_abolished.zip

          test -s /tmp/mois/jscode20260720_abolished.zip
          unzip -t /tmp/mois/jscode20260720_abolished.zip
          sha256sum /tmp/mois/jscode20260720_abolished.zip | tee /tmp/mois/SHA256SUMS.txt
          unzip -l /tmp/mois/jscode20260720_abolished.zip | tee /tmp/mois/ZIP_CONTENTS.txt
          mkdir -p /tmp/mois/extracted
          unzip -o /tmp/mois/jscode20260720_abolished.zip -d /tmp/mois/extracted

      - name: Normalize administrative/legal/mapping files
        run: |
          python scripts/import_mois_jscode.py /tmp/mois/extracted \
            --snapshot-date 2026-07-20 \
            --out-dir /tmp/mois/normalized

      - name: Show normalized counts
        run: |
          cat /tmp/mois/normalized/mois_jscode_import_meta.json
          wc -l /tmp/mois/normalized/*.csv || true

      - name: Upload normalized snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mois-jscode-20260720-normalized
          path: |
            /tmp/mois/normalized/**
            /tmp/mois/SHA256SUMS.txt
            /tmp/mois/ZIP_CONTENTS.txt
          if-no-files-found: warn
          retention-days: 30
